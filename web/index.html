<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Tomekeeper: a reading tracker that counts pages, with a yearly goal, quests and a medieval chronicle of what you read." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Tomekeeper</title>
    <!--
      Sets the theme and script before the first paint, so a dark-theme reader never sees a flash of the light page.
      It is a separate file, not inline, so the Content Security Policy can forbid inline scripts.
    -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
