name: API

on:
  push:
    branches: [master, main]
    paths: ['api/**', 'Directory.*.props', 'global.json', 'Tomekeeper.slnx', '.github/workflows/api.yml']
  pull_request:
    paths: ['api/**', 'Directory.*.props', 'global.json', 'Tomekeeper.slnx', '.github/workflows/api.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      # The tests start PostgreSQL in Docker with Testcontainers; GitHub's Ubuntu runners have Docker.
      - run: dotnet test --no-build --configuration Release
